[project]
name = "job-cannon"
version = "0.1.0"
description = "Local job-search manager: applications, contacts, follow-ups, and files in one portable folder."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "fpdf2>=2.8.9",
]

[project.optional-dependencies]
# Local transcription of recorded interview-prep answers: uv sync --extra voice
# av<19: PyAV 19 dropped the open() argument faster-whisper 1.2 passes when decoding.
voice = ["faster-whisper>=1.1", "av<19"]

[project.scripts]
job-cannon = "job_cannon.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_cannon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
