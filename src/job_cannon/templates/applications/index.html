{% extends "base.html" %}
{% block title %}Applications{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Applications</h1>
  <a href="/applications/new" role="button">+ New application</a>
</div>
<form class="filters" hx-get="/applications" hx-target="#rows" hx-trigger="input delay:250ms, change" hx-push-url="true">
  <input type="search" name="q" value="{{ q }}" placeholder="Search company, role, location, notes…" aria-label="Search">
  <select name="status" aria-label="Status">
    <option value="">All statuses</option>
    {% for s in STATUSES %}<option value="{{ s }}" {% if s == status %}selected{% endif %}>{{ STATUS_LABELS[s] }}</option>{% endfor %}
  </select>
  <select name="sort" aria-label="Sort">
    <option value="updated" {% if sort != 'interest' %}selected{% endif %}>Recently updated</option>
    <option value="interest" {% if sort == 'interest' %}selected{% endif %}>Most interested</option>
  </select>
  <label class="archived-toggle"><input type="checkbox" name="archived" value="1" {% if archived %}checked{% endif %}> Archived</label>
  <noscript><button>Filter</button></noscript>
</form>
<div id="rows">{% include "applications/_rows.html" %}</div>
{% endblock %}
