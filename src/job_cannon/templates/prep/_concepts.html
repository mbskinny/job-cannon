{% if rows %}
<div class="table-wrap">
<table class="striped">
  <thead><tr><th>Concept</th><th>Explanation</th><th>Questions</th></tr></thead>
  <tbody>
    {% for r in rows %}
    <tr>
      <td><a href="/prep/concepts/{{ r.id }}"><strong>{{ r.name }}</strong></a></td>
      <td>{% if r.explanation %}<small>{{ r.explanation|truncate(140) }}</small>{% else %}<small class="muted">Not written yet</small>{% endif %}</td>
      <td>{{ r.question_count }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% else %}
<p class="muted">No concepts match.</p>
{% endif %}
