{% if rows %}
<div class="table-wrap">
<table class="striped">
  <thead><tr><th>Question</th><th>Tags</th><th>Answers</th><th>Last practised</th></tr></thead>
  <tbody>
    {% for r in rows %}
    <tr>
      <td><a href="/prep/{{ r.id }}{% if application %}?application={{ application }}{% endif %}">{{ r.prompt }}</a></td>
      <td>{% for t in (r.tags or '').split(',') if t %}<a class="tag" href="/prep?tag={{ t|urlencode }}">{{ t }}</a> {% endfor %}</td>
      <td>{{ r.answer_count }}</td>
      <td><small class="muted">{{ (r.last_practiced or '')[:10] }}</small></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% else %}
<p class="muted">No questions match.</p>
{% endif %}
