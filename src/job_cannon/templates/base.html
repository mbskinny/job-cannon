<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Cannon{% endblock %} · Job Cannon</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="container-fluid site-header">
    <nav>
      <ul><li><a href="/" class="brand">{% include "partials/logo.html" %}<span class="wordmark">Job Cannon</span></a></li></ul>
      <ul>
        {% set path = request.url.path %}
        <li><a href="/" {% if path == '/' %}aria-current="page"{% endif %}>Dashboard</a></li>
        <li><a href="/board" {% if path.startswith('/board') %}aria-current="page"{% endif %}>Board</a></li>
        <li><a href="/applications" {% if path.startswith('/applications') %}aria-current="page"{% endif %}>Applications</a></li>
        <li><a href="/contacts" {% if path.startswith('/contacts') %}aria-current="page"{% endif %}>Contacts</a></li>
        <li><a href="/cover-letters" {% if path.startswith('/cover-letters') %}aria-current="page"{% endif %}>Cover letters</a></li>
        <li><a href="/applications/new" role="button" class="nav-cta">+ New</a></li>
      </ul>
    </nav>
  </header>
  <main class="{% block main_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
